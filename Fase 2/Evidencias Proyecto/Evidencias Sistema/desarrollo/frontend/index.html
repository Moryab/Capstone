<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>RoomMatch | Tu hogar y tu roomie ideal</title>
    <meta name="description" content="RoomMatch conecta estudiantes según su estilo de convivencia para encontrar roomie compatible y alojamiento cerca de su sede, con seguimiento después del match." />
    <meta name="theme-color" content="#0e2440" />
    <!-- Open Graph: vista previa al compartir el enlace. Al publicar, cambiar las URL por el dominio real -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoomMatch" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="RoomMatch | Tu hogar y tu roomie ideal" />
    <meta property="og:description" content="Encuentra roomie compatible según tu estilo de convivencia y alojamiento cerca de donde estudias." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de RoomMatch con el lema Tu hogar y tu roomie ideal" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Aplica el tema guardado antes de cargar la app, para que no se vea un destello claro -->
    <script>
      try {
        var tema = JSON.parse(localStorage.getItem('rm_tema'))
        if (tema === 'oscuro' || (!tema && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('tema-oscuro')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
