services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # Sin "ports": Mongo solo es accesible dentro de la red de Docker

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    ports:
      - "8000:8000"   # en el servidor esto lo reemplazará Nginx
    volumes:
      - media_data:/app/media   # fotos de perfil: no se pierden al reconstruir la API

volumes:
  mongo_data:
  media_data:
