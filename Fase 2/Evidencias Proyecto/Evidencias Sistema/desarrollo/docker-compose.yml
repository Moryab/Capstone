services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: America/Santiago   # hora de Chile en los registros; Mongo igual guarda las fechas en UTC
    volumes:
      - mongo_data:/data/db
    # Sin "ports": Mongo solo es accesible dentro de la red de Docker

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Hora de Chile para los registros y para date.today() (edad, año de ingreso).
      # Las fechas se siguen guardando en UTC y el navegador las muestra en la hora local
      TZ: America/Santiago
    depends_on:
      - mongo
    ports:
      - "8000:8000"   # en el servidor esto lo reemplazará Nginx
    volumes:
      - media_data:/app/media   # fotos de perfil: no se pierden al reconstruir la API
      - privado_data:/app/privado   # comprobantes de estudiante: no se publican como archivos estáticos

volumes:
  mongo_data:
  media_data:
  privado_data:
