# Nombre fijo del proyecto: la carpeta antes se llamaba «desarrollo» y Docker nombra con él los
# contenedores y los volúmenes (la base de datos). Si se cambia, la API parte con una base vacía.
name: desarrollo

# MongoDB y su inicialización (índices y catálogos) están en la carpeta «Base de datos»
include:
  - path: ../Base de datos/docker-compose.yml
    env_file: .env

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Hora de Chile para los registros y para date.today() (edad, año de ingreso).
      # Las fechas se siguen guardando en UTC y el navegador las muestra en la hora local
      TZ: America/Santiago
    depends_on:
      # Arranca cuando la base ya tiene sus índices y catálogos
      inicializar-bd:
        condition: service_completed_successfully
    ports:
      - "8000:8000"   # en el servidor esto lo reemplazará Nginx
    volumes:
      - media_data:/app/media   # fotos de perfil: no se pierden al reconstruir la API
      - privado_data:/app/privado   # comprobantes de estudiante: no se publican como archivos estáticos

volumes:
  media_data:
  privado_data:
